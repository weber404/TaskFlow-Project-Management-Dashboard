<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="tf-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72C7BE" />
      <stop offset="100%" stop-color="#72C7A5" />
    </linearGradient>
    <linearGradient id="tf-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282828" />
      <stop offset="100%" stop-color="#1E1E1E" />
    </linearGradient>
  </defs>

  <!-- Apple-style dark squircle base -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="#141414" stroke="#343434" stroke-width="12" />

  <!-- Background Layer (Task Stack) -->
  <rect x="120" y="96" width="272" height="180" rx="26" fill="#1E1E1E" stroke="#72C7BE" stroke-opacity="0.32" stroke-width="10" />

  <!-- Foreground Primary Task Card -->
  <rect x="96" y="168" width="320" height="248" rx="32" fill="url(#tf-card-grad)" stroke="#444444" stroke-width="10" />

  <!-- Flow Lines -->
  <line x1="136" y1="224" x2="220" y2="224" stroke="#72C7BE" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round" />
  <line x1="136" y1="256" x2="190" y2="256" stroke="#8A8A8A" stroke-opacity="0.5" stroke-width="8" stroke-linecap="round" />

  <!-- Dynamic TaskFlow Checkmark -->
  <path d="M 184 320 L 244 372 L 352 232" fill="none" stroke="url(#tf-accent-grad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Active Status Dot -->
  <circle cx="376" cy="188" r="12" fill="#72C7BE" />
</svg>
